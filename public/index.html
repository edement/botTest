<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Mini App тест</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0; padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    input, button {
      width: 100%; box-sizing: border-box;
      padding: 14px; font-size: 16px;
      border-radius: 10px; margin-top: 12px;
    }
    input { border: 1px solid #8884; background: transparent; color: inherit; }
    button {
      border: none; cursor: pointer;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    #result { margin-top: 20px; font-size: 20px; font-weight: 600; }
    #debug { margin-top: 30px; font-size: 12px; opacity: .6; }
  </style>
</head>
<body>
  <h2>Тест Mini App</h2>
  <input id="word" type="text" placeholder="Введите слово">
  <button id="send">Отправить</button>
  <div id="result"></div>
  <div id="debug"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const hasInitData = !!(tg && tg.initData);
    document.getElementById('debug').textContent =
      'Telegram WebApp: ' + (tg ? 'найден' : 'НЕ найден') +
      ' | initData: ' + (hasInitData ? 'есть' : 'пусто');

    document.getElementById('send').addEventListener('click', async () => {
      const result = document.getElementById('result');
      const word = document.getElementById('word').value;
      result.textContent = '...';
      try {
        const r = await fetch('/api/word', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ word, initData: tg ? tg.initData : '' })
        });
        const data = await r.json();
        result.textContent = data.message;
        document.getElementById('debug').textContent +=
          ' | подпись Telegram: ' + (data.telegramVerified ? 'OK' : 'не прошла');
      } catch (e) {
        result.textContent = 'Ошибка: ' + e.message;
      }
    });
  </script>
</body>
</html>
